# Use an official Node.js image as the base for our jobs
image: node:18

# Define the stages of our pipeline. Jobs run in this order.
stages:
  - build
  - test

# This block runs before any job in the pipeline
before_script:
  - echo "Installing dependencies..."
  - npm install

# First job: Linting our code for style and errors
lint-job:
  stage: test # Runs in the 'test' stage
  script:
    - echo "Running linter..."
    - npm run lint

# Second job: Running our unit/integration tests
test-job:
  stage: test # Also runs in the 'test' stage
  script:
    - echo "Running tests..."
    - npm run test