image: node:20

stages:
  - install
  - lint
  - test
  - build

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm install
  - pnpm common build

lint:
  stage: lint
  script:
    - pnpm all:lint

test:
  stage: test
  script:
    - pnpm all:test

build:
  stage: build
  script:
    - pnpm all:build
