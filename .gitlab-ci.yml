image: node:20

stages:
  - install
  - lint
  - test

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm install
  - pnpm tsc -b ./packages/common

lint-job:
  stage: test
  script:
    - pnpm --filter user-service run lint
    - pnpm --filter payment-service run lint

test-job:
  stage: test
  script:
    - pnpm --filter user-service run test
    - pnpm --filter payment-service run test
