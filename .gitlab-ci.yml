image: node:20

stages:
  - install
  - lint
  - test
  - build

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm install
  - pnpm common build

lint_common_job:
  stage: lint
  script:
    - pnpm common lint
  rules:
    - changes:
        - packages/common/*
        - gitlab-ci.yml
        - package.json
      when: always

test_common_job:
  stage: test
  script:
    - pnpm common test
  rules:
    - changes:
        - packages/common/*
        - gitlab-ci.yml
        - package.json
      when: always

build_common_job:
  stage: build
  script:
    - pnpm common build
  rules:
    - changes:
        - packages/common/*
        - gitlab-ci.yml
        - package.json
      when: always

