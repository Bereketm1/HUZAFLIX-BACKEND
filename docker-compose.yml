services:
  postgres:
    image: postgres:latest
    container_name: huzaflix_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: huzaflix_redis
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    env_file:
      - ./apps/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: ./apps/analytics-service/Dockerfile
    container_name: analytics_service
    restart: unless-stopped
    env_file:
      - ./apps/analytics-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: ./apps/gateway-service/Dockerfile
    container_name: gateway_service
    restart: unless-stopped
    env_file:
      - ./apps/gateway-service/.env

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - gateway-service

volumes:
  postgres_data:

networks:
  default:
    name: huzaflix-network
    driver: bridge
