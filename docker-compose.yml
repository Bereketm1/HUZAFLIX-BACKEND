version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: huzaflix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: huzaflix
      POSTGRES_PASSWORD: huzaflix
      POSTGRES_DB: huzaflix_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: huzaflix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huzaflix_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://huzaflix:huzaflix@postgres:5432/huzaflix_dev
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
