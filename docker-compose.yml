services:
  postgres:
    image: postgres:latest
    container_name: huzaflix_postgres
    restart: unless-stopped
    env_file:
      - ./.env.postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: huzaflix_redis
    restart: unless-stopped
    env_file:
      - ./.env.redis
    ports:
      - '${REDIS_PORT}:6379'

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: huzaflix_user_service
    restart: unless-stopped
    env_file:
      - ./apps/user-service/.env
    ports:
      - '${USER_SERVICE_PORT}:3000'
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

networks:
  default:
    name: huzaflix-network
    driver: bridge
