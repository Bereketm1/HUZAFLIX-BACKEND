services:
  postgres:
    image: postgres:latest
    container_name: huzaflix_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: huzaflix_redis
    restart: unless-stopped
    env_file:
      - ./.env
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    env_file:
      - ./apps/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: ./apps/analytics-service/Dockerfile
    container_name: analytics_service
    restart: unless-stopped
    env_file:
      - ./apps/analytics-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-mgmt-service:
    build:
      context: .
      dockerfile: ./apps/api-mgmt-service/Dockerfile
    container_name: api_mgmt_service
    restart: unless-stopped
    env_file:
      - ./apps/api-mgmt-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
    container_name: payment_service
    restart: unless-stopped
    env_file:
      - ./apps/payment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  audit-log-service:
    build:
      context: .
      dockerfile: ./apps/audit-log-service/Dockerfile
    container_name: audit_log_service
    restart: unless-stopped
    env_file:
      - ./apps/audit-log-service/.env
    environment:
      DB_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: ./apps/gateway-service/Dockerfile
    container_name: gateway_service
    restart: unless-stopped
    env_file:
      - ./apps/gateway-service/.env
    ports:
      - "5030:3000"
    depends_on:
      user-service:
        condition: service_started
      analytics-service:
        condition: service_started
      api-mgmt-service:
        condition: service_started
      payment-service:
        condition: service_started
      audit-log-service:
        condition: service_started

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z
  #     - prometheus_data:/prometheus:z
  #   ports:
  #     - '9090:9090'
  #   depends_on:
  #     - gateway-service
  #     - user-service
  #     - analytics-service

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   restart: unless-stopped
  #   env_file:
  #     - ./.env
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   ports:
  #     - '5001:3000'
  #   volumes:
  #     - grafana_data:/var/lib/grafana:z
  #   depends_on:
  #     - prometheus

  minio:
    image: minio/minio:latest
    container_name: huzaflix-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA_DIR}:/data:z
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: huzaflix-network
    driver: bridge
