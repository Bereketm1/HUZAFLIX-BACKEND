services:
  postgres:
    image: postgres:latest
    container_name: huzaflix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'

  redis:
    image: redis:latest
    container_name: huzaflix_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huzaflix_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: ${DB_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
